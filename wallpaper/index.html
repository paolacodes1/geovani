<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Papel de parede com QR</title>
<link rel="stylesheet" href="../fonts.css?v=20261102">
<style>
:root{--navy:#13233F;--on-navy:#F3F4F6}
html,body{margin:0;height:100%;background:var(--navy)}
.wp{position:relative;overflow:hidden;width:100vw;height:100vh;height:100dvh;min-height:100%;background:var(--navy);color:var(--on-navy)}
.stack{position:absolute;left:0;right:0;top:380px;display:flex;flex-direction:column;align-items:center;gap:28px}
.qr{padding:12px;background:#FFF;border-radius:2px}
.qr img{display:block;width:184px;height:184px}
.name{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:48px;line-height:44px;color:var(--on-navy)}
</style>
</head>
<body>
<div class="wp">
  <div class="stack">
    <div class="qr"><img src="qr-geovani.svg" alt="QR code para o cartão digital de Geovani Gisler"></div>
    <p class="name">Geovani Gisler</p>
  </div>
</div>
</body>
</html>
